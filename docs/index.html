<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warcraft III Unit Classifier</title>
<style>
  body { margin: 0; min-height: 100vh; background: #14110c; color: #eadfc4;
         font-family: Georgia, serif; display: flex; justify-content: center; }
  main { width: min(900px, 100% - 32px); padding: 32px 0; }
  h1 { color: #e2b64f; font-size: 1.8rem; margin: 0 0 4px; }
  p { color: #b9ad90; }
  .panel { background: #221c13; border: 2px solid #6b5426; border-radius: 6px; padding: 16px; }
  #preview { display: block; max-width: 100%; max-height: 520px; margin: 12px auto; }
  .examples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .examples img { width: 56px; height: 56px; object-fit: cover; border: 1px solid #6b5426;
                  border-radius: 4px; cursor: pointer; }
  .examples img:hover { border-color: #e2b64f; }
  #status { min-height: 1.2em; color: #b9ad90; }
  .row { display: flex; justify-content: space-between; margin-top: 10px; }
  .bar { height: 8px; background: #3a2f1d; border-radius: 4px; overflow: hidden; }
  .bar div { height: 100%; background: #e2b64f; }
</style>
</head>
<body>
<main>
  <h1>Warcraft III Unit Classifier</h1>
  <p>Upload a Warcraft III picture. The fastai model (convnext_tiny) runs right here in your browser.</p>
  <div class="panel">
    <input type="file" id="file" accept="image/*">
    <div class="examples" id="examples"></div>
    <img id="preview" alt="" hidden>
    <div id="status">Loading model...</div>
    <div id="result"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/ort.min.js"></script>
<script>
  const MEAN = [0.485, 0.456, 0.406], STD = [0.229, 0.224, 0.225];   // ImageNet stats, same as fastai

  const preview = document.getElementById("preview");
  const status = document.getElementById("status");
  const result = document.getElementById("result");
  let session, info;   // info = model.json: labels, multi_label, threshold, width, height, examples

  async function loadModel() {
    info = await (await fetch("model.json")).json();
    for (const name of info.examples) {
      const img = document.createElement("img");
      img.src = `examples/${name}`;
      img.onclick = () => show(img.src);
      document.getElementById("examples").append(img);
    }
    session = await ort.InferenceSession.create("model.onnx");
    status.textContent = "Ready. Choose a picture or click an example.";
  }

  // Same steps as fastai: squish to width x height, divide by 255, normalize, channels first
  function toTensor(img) {
    const w = info.width, h = info.height;
    const canvas = document.createElement("canvas");
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(img, 0, 0, w, h);
    const pixels = ctx.getImageData(0, 0, w, h).data;
    const data = new Float32Array(3 * w * h);
    for (let i = 0; i < w * h; i++)
      for (let c = 0; c < 3; c++)
        data[c * w * h + i] = (pixels[i * 4 + c] / 255 - MEAN[c]) / STD[c];
    return new ort.Tensor("float32", data, [1, 3, h, w]);
  }

  function bars(list) {
    return list.map(c => `
      <div class="row"><span>${c.label}</span><span>${(c.p * 100).toFixed(1)}%</span></div>
      <div class="bar"><div style="width:${c.p * 100}%"></div></div>`).join("");
  }

  async function classify() {
    if (!session) return;
    status.textContent = "Thinking...";
    const output = await session.run({ image: toTensor(preview) });
    const logits = Array.from(output.logits.data);
    if (info.multi_label) {
      // sigmoid: every unit gets its own 0-100% score
      const scores = logits.map((x, i) => ({ label: info.labels[i], p: 1 / (1 + Math.exp(-x)) }))
                           .sort((a, b) => b.p - a.p);
      const found = scores.filter(c => c.p >= info.threshold);
      status.textContent = found.length ? `Found ${found.length} unit type(s):` : "No units found. Closest guesses:";
      result.innerHTML = bars(found.length ? found : scores.slice(0, 3));
    } else {
      // softmax: the scores add up to 100%
      const exps = logits.map(x => Math.exp(x - Math.max(...logits)));
      const sum = exps.reduce((a, b) => a + b);
      result.innerHTML = bars(exps.map((e, i) => ({ label: info.labels[i], p: e / sum }))
                                  .sort((a, b) => b.p - a.p).slice(0, 3));
      status.textContent = "";
    }
  }

  function show(src) {
    result.innerHTML = "";
    preview.onload = classify;
    preview.src = src;
    preview.hidden = false;
  }

  document.getElementById("file").onchange = e => show(URL.createObjectURL(e.target.files[0]));
  loadModel().then(() => { if (preview.src) classify(); })
             .catch(err => status.textContent = "Could not load the model: " + err.message);
</script>
</body>
</html>
